---
name: Bump Version

# Thin caller: version-file bump + uv.lock sync + signed commit + PR, via the
# shared qte77/.github workflow. The tag is created after merge by
# tag-release.yaml; the GitHub Release by publish-release.yaml.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  bump:
    uses: qte77/.github/.github/workflows/bump-version.yml@86d329865ce47b43b6e745084c92032b41dcab1b  # 2026-10-24
    permissions:
      contents: write
      pull-requests: write
    with:
      bump_type: ${{ inputs.bump_type }}
      sync_lockfile: true
...
