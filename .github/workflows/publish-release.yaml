---
name: Publish Release

# Thin caller: create the GitHub Release for a tag, with notes from the
# CHANGELOG.md "## [version]" block. tag-release.yaml publishes new tags itself;
# dispatch this only to retry or to publish an older tag.
# Aborts if the Release already exists; never overwrites.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (empty = latest v* tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    uses: qte77/.github/.github/workflows/publish-release.yml@43ad1211e962f82fab823377dcc7272054d8196c  # 2026-11-11
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
...
