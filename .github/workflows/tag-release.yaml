---
name: Tag Release

# Thin caller: when a merged bump changes the version in pyproject.toml, create
# the annotated v{version} tag. Exits 0 when the version is unchanged; never
# deletes or overwrites an existing tag. A new tag is published as a GitHub
# Release in the same run (job `publish`).

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  tag:
    uses: qte77/.github/.github/workflows/tag-release.yml@43ad1211e962f82fab823377dcc7272054d8196c  # 2026-11-11
    permissions:
      contents: write
  publish:
    # Publish the Release in the same run: a tag pushed with GITHUB_TOKEN starts no
    # `on: push: tags` workflow. Skipped when this push created no tag.
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: qte77/.github/.github/workflows/publish-release.yml@43ad1211e962f82fab823377dcc7272054d8196c  # 2026-11-11
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
...
